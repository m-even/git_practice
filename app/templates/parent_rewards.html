{% extends "base.html" %}

{% block title %}Manage Rewards - Parent{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Manage Rewards</h1>
</div>

<div id="message-area-rewards" class="mb-3"></div>

<button id="add-new-reward-btn" class="btn btn-primary mb-3">Add New Reward</button>

<div id="create-reward-form-container" style="display: none;" class="mb-3 card card-body">
    <h2>Create New Reward</h2>
    <form id="create-reward-form">
        <div class="form-group">
            <label for="reward-name">Name:</label>
            <input type="text" id="reward-name" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="reward-description">Description:</label>
            <textarea id="reward-description" name="description" class="form-control"></textarea>
        </div>
        <div class="form-group">
            <label for="reward-point-cost">Point Cost:</label>
            <input type="number" id="reward-point-cost" name="point_cost" class="form-control" required min="1">
        </div>
        <div class="form-group">
            <label for="reward-availability">Availability:</label>
            <select id="reward-availability" name="availability" class="form-control">
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
                <option value="limited_stock">Limited Stock</option>
            </select>
        </div>
        <div class="form-group" id="reward-stock-quantity-group" style="display: none;">
            <label for="reward-stock-quantity">Stock Quantity:</label>
            <input type="number" id="reward-stock-quantity" name="stock_quantity" class="form-control" min="0">
        </div>
        <button type="submit" class="btn btn-success">Save Reward</button>
        <button type="button" id="cancel-add-reward-btn" class="btn btn-secondary">Cancel</button>
    </form>
</div>

<h2>Existing Rewards</h2>
<div id="rewards-list">
    <p>Loading rewards...</p>
</div>

<!-- Edit Reward Modal -->
<div id="editRewardModal" class="modal" style="display: none;">
    <div class="modal-content card card-body">
        <span class="close-btn" id="close-edit-reward-modal-btn">&times;</span>
        <h2>Edit Reward</h2>
        <div id="message-area-edit-reward-modal" class="mb-3"></div>
        <form id="edit-reward-form">
            <input type="hidden" id="edit-reward-id" name="reward_id">
            <div class="form-group">
                <label for="edit-reward-name">Name:</label>
                <input type="text" id="edit-reward-name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="edit-reward-description">Description:</label>
                <textarea id="edit-reward-description" name="description" class="form-control"></textarea>
            </div>
            <div class="form-group">
                <label for="edit-reward-point-cost">Point Cost:</label>
                <input type="number" id="edit-reward-point-cost" name="point_cost" class="form-control" required min="1">
            </div>
            <div class="form-group">
                <label for="edit-reward-availability">Availability:</label>
                <select id="edit-reward-availability" name="availability" class="form-control">
                    <option value="available">Available</option>
                    <option value="unavailable">Unavailable</option>
                    <option value="limited_stock">Limited Stock</option>
                </select>
            </div>
            <div class="form-group" id="edit-reward-stock-quantity-group" style="display: none;">
                <label for="edit-reward-stock-quantity">Stock Quantity:</label>
                <input type="number" id="edit-reward-stock-quantity" name="stock_quantity" class="form-control" min="0">
            </div>
            <button type="submit" class="btn btn-success">Save Changes</button>
            <button type="button" id="cancel-edit-reward-btn" class="btn btn-secondary">Cancel</button>
        </form>
    </div>
</div>

{# Basic Modal Styling - can be moved to main CSS if used elsewhere #}
<style>
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
.modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 600px; border-radius: 8px; position: relative; }
.close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; position: absolute; top: 10px; right: 20px; }
.close-btn:hover, .close-btn:focus { color: black; text-decoration: none; cursor: pointer; }
</style>

<script src="{{ url_for('static', filename='js/parent_rewards.js') }}" defer></script>
{% endblock %}
