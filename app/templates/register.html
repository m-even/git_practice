{% extends "base.html" %}

{% block title %}Register - Family Chore & Reward App{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Register</h1>
</div>
<div id="message-area"></div> {# For displaying success/error messages #}
<form id="registerForm">
    <div>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
    </div>
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>
    <div>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
    </div>
    {# Role is implicitly 'parent' for self-registration via this form #}
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{{ url_for('main.login_view') }}">Login here</a>.</p>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('registerForm');
        if(registerForm) {
            registerForm.addEventListener('submit', handleRegister);
        }
    });
</script>
{% endblock %}
