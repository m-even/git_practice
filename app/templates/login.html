{% extends "base.html" %}

{% block title %}Login - Family Chore & Reward App{% endblock %}

{% block content %}
<div class="auth-form-container">
    <div class="page-header">
        <h1>Login</h1>
    </div>
    <div id="message-area" class="mb-3"></div> {# For displaying success/error messages #}
    <form id="loginForm">
        <div class="form-group">
            <label for="username_or_email">Username or Email:</label>
            <input type="text" id="username_or_email" name="username_or_email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="mt-3 text-center">Don't have an account? <a href="{{ url_for('main.register_view') }}">Register here</a>.</p>

    <div class="social-login-separator">
        <span class="separator-text">OR</span>
    </div>

    <div class="social-login-buttons">
        <a href="{{ url_for('google.login') }}" class="btn social-btn google-btn btn-block">
            Sign in with Google
        </a>
        <a href="{{ url_for('facebook.login') }}" class="btn social-btn facebook-btn btn-block">
            Sign in with Facebook
        </a>
        <a href="#" onclick="alert('Sign in with Apple is not yet implemented.'); return false;" class="btn social-btn apple-btn btn-block">
            Sign in with Apple
        </a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        if(loginForm) {
            loginForm.addEventListener('submit', handleLogin);
        }
    });
</script>
{% endblock %}
